[project]
name = "Omen"
version = "2.0.0"
description = "An AI assistant that can speak, and walk around the internet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "faster-whisper",
    "halo",
    "markdown",
    "numpy",
    "openai",
    "piper-tts",
    "pyaudio",
    "python-dotenv",
    "rich",
    "scipy",
    "torch",
    "yt-dlp",
    "openwakeword>=0.4.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]

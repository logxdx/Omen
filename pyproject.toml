[project]
name = "Omen"
version = "1.2.0"
description = "An AI assistant that can speak, and walk around the internet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.13.5",
    "browserforge==1.2.3",
    "chromadb>=1.1.0",
    "crawl4ai==0.7.0",
    "ddgs==9.4.3",
    "fake-useragent==2.2.0",
    "faster-whisper==1.2.0",
    "groq>=0.31.1",
    "halo==0.0.31",
    "html2text==2025.4.15",
    "keyboard==0.13.5",
    "litellm==1.72.0",
    "markdown==3.8.2",
    "mem0ai[graph]==0.1.118",
    "openai==1.109.1",
    "openai-agents==0.3.0",
    "openwakeword>=0.4.0",
    "piper-tts==1.3.0",
    "pyaudio==0.2.14",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
    "silero-vad==6.0.0",
    "spider-rs==0.0.57",
    "yt-dlp==2025.9.5",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]

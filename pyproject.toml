[project]
name = "Omen"
version = "1.3.0"
description = "An AI assistant that can speak, and walk around the internet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol",
    "browserforge",
    "crawlberg",
    "ddgs",
    "fastapi",
    "litellm",
    "openai-agents",
    "python-dotenv",
    "requests",
    "rich",
    "textual",
    "uvicorn",
    "yt-dlp",
]

[project.optional-dependencies]
# Speech in/out (omen/voice): `uv sync --extra voice`. Text mode never imports these.
voice = [
    "faster-whisper",
    "halo",
    "markdown",
    "numpy",
    "openwakeword>=0.4.0",
    "pyaudio",
    "scipy",
    "torch>=2.14.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]
# Omen fork of the OpenAI Agents SDK (see vendor/openai-agents/FORK.md)
openai-agents = { path = "vendor/openai-agents", editable = true }

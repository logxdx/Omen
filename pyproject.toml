[project]
name = "Omen"
version = "1.3.0"
description = "An AI assistant that can speak, and walk around the internet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "browserforge",
    "crawl4ai",
    "ddgs",
    "faster-whisper",
    "halo",
    "html2text",
    "litellm",
    "liteparse",
    "markdown",
    "numpy",
    "openai-agents",
    "piper-tts",
    "pyaudio",
    "python-dotenv",
    "requests",
    "scipy",
    "spider_rs",
    "rich",
    "statsmodels",
    "yt-dlp",
    "openwakeword>=0.4.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]
spider_rs = { path = "spider-py" }

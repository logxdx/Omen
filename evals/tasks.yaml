# Small-model eval tasks. Run with: python -m omen eval [--only id ...] [--repeat N]
#
# Fields:
#   prompt           user message
#   expect_tools     tools that must be called (order not enforced); [] = no tool calls allowed
#   expect_args      per tool, argument values that must appear (case-insensitive substring)
#   expect_answer    substrings that must all appear in the final answer (case-insensitive)
#   expect_answer_any  at least one of these substrings must appear
#   max_steps        LLM steps allowed (default 4; 6 for agent: omen)
#   agent            "delegator": main agent only has `delegate` to a "researcher" persona
#   history          earlier conversation (list of {role, content}) seeded before the prompt
#   expect_context_passed  a delegate call must set share_context or mention this text in its task

- id: weather_simple
  prompt: What's the weather in Paris right now?
  expect_tools: [get_weather]
  expect_args: {get_weather: {city: paris}}
  expect_answer: ["18"]

- id: weather_fahrenheit
  prompt: How hot is it in Tokyo in Fahrenheit?
  expect_tools: [get_weather]
  expect_args: {get_weather: {city: tokyo, units: f}}
  expect_answer: ["75"]

- id: no_tool_needed
  prompt: How do you say "good morning" in French?
  expect_tools: []
  expect_answer_any: [bonjour, bonne matinée]

- id: contact_lookup
  prompt: What's Tom's email address?
  expect_tools: [lookup_contact]
  expect_args: {lookup_contact: {name: tom}}
  expect_answer: [tom@becker.dev]

- id: notes_search
  prompt: What's the wifi password for the cabin? Check my notes.
  expect_tools: [search_notes]
  expect_answer: [pinecone-42]

- id: currency_convert
  prompt: Convert 100 euros to Indian rupees.
  expect_tools: [convert_currency]
  expect_args: {convert_currency: {from_currency: eur, to_currency: inr}}
  expect_answer: ["9,000"]

- id: reminder_simple
  prompt: Remind me to water the plants tomorrow at 8am.
  expect_tools: [create_reminder]
  expect_args: {create_reminder: {text: plant, when: "8"}}

- id: chain_contact_reminder
  prompt: Look up Priya's phone number and set a reminder for Friday 6pm to call her on it.
  expect_tools: [lookup_contact, create_reminder]
  expect_args: {create_reminder: {text: "98200"}}
  max_steps: 5

- id: error_recovery_unknown_city
  prompt: What's the weather in Atlantis?
  expect_tools: [get_weather]
  expect_answer: [atlantis]

- id: two_cities
  prompt: Is it warmer in Mumbai or Paris right now?
  expect_tools: [get_weather]
  expect_answer: [mumbai]
  max_steps: 5

# --- delegation (main agent only has `delegate`; persona "researcher" has notes + contacts) ---

- id: delegate_lookup
  agent: delegator
  prompt: Ask the researcher to find the Wi-Fi password for the cabin in my notes.
  expect_tools: [delegate]
  expect_args: {delegate: {persona: researcher}}
  expect_answer: [pinecone-42]

- id: delegate_contact
  agent: delegator
  prompt: Get the researcher to look up Priya's phone number.
  expect_tools: [delegate]
  expect_answer: ["98200"]

- id: delegate_needs_context
  agent: delegator
  history:
    - {role: user, content: "My friend Tom is visiting next week and I want to send him the plan."}
    - {role: assistant, content: "Sounds good. What do you need?"}
  prompt: Ask the researcher to find his email address.
  expect_tools: [delegate]
  expect_context_passed: tom
  expect_answer: [tom@becker.dev]

# --- full assistant (agent: omen): real skills, fresh sandbox + memory per task, confirmations answered "yes" ---
#   files: {path: content} seeds the sandbox; expect_files: {path: substring} checks the result
#   router: false disables the keyword pre-router (skill tools are always visible; no instructions pre-loaded)
#   network: true tasks hit live services and run only with OMEN_EVAL_NETWORK=1

- id: omen_write_note
  agent: omen
  prompt: Create a note at notes/shopping.md listing eggs and bread.
  expect_tools: [write_file]
  expect_files: {notes/shopping.md: eggs}

- id: omen_read_note
  agent: omen
  files: {notes/plans.md: "Trip to Goa on 12 December. Book the train by Friday."}
  prompt: What does my notes/plans.md file say?
  expect_tools: [read_file]
  expect_answer: [goa]

- id: omen_edit_note
  agent: omen
  files: {notes/todo.md: "- buy milk\n- call Anna\n- pay rent\n"}
  prompt: In notes/todo.md, change "call Anna" to "call Anna at 6pm".
  expect_tools: [edit_file]
  expect_files: {notes/todo.md: call Anna at 6pm}
  max_steps: 5

- id: omen_find_in_files
  agent: omen
  files: {notes/a.md: "Groceries: milk, rice", notes/b.md: "Wi-Fi password for the cabin: pinecone-42", notes/c.md: "Dentist on Friday"}
  prompt: Which of my notes has the cabin wifi password, and what is it?
  expect_answer: [pinecone-42]
  max_steps: 5

- id: omen_remember
  agent: omen
  prompt: Please remember that my sister's birthday is on May 3.
  expect_tools: [remember]
  expect_args: {remember: {fact: may 3}}

- id: omen_skill_tool_without_router
  agent: omen
  router: false
  prompt: Create a file called hello.txt that says hi.
  expect_tools: [write_file]
  expect_files: {hello.txt: hi}
  max_steps: 5

- id: omen_weather_live
  agent: omen
  network: true
  prompt: What's the weather in Pune right now?
  expect_tools: [get_weather]

- id: omen_web_live
  agent: omen
  network: true
  prompt: Search the web for what crawlberg is and tell me in one sentence.
  expect_tools: [search]
  max_steps: 5

- id: omen_delegate_writer
  agent: omen
  prompt: Ask the writer to draft a two-sentence message to Anna saying I'll be 20 minutes late for dinner.
  expect_tools: [delegate]
  expect_args: {delegate: {persona: writer}}
  expect_answer: [anna]

- id: omen_delegate_researcher_live
  agent: omen
  network: true
  prompt: Have the researcher find out what crawlberg is.
  expect_tools: [delegate]
  expect_args: {delegate: {persona: researcher}}
  max_steps: 4
